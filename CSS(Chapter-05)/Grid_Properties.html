<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Properties</title>
    <style>
      .container {
        width: 600px;
        height: 300px;
        background-color: aqua;
        display:inline-grid;
        /* grid-template-rows: 100px 100px 100px 100px ;
        grid-template-columns: auto auto auto auto auto; */
        grid-template-rows: 1fr 1fr 1fr;
        grid-template-columns: repeat(3 , 1fr);
        grid-gap:10px;
        justify-items: center;
        align-items: end;
      }
      .c1 {
        /* height: 70px; */
        width: 100px;
        background-color: blue;
        border: 2px solid rgb(0, 0, 0);
        text-align: center;
        color:white;
      }

      /* .vb{
    grid-column-start: 1;
    grid-column-end:4;
      }
    .bc{
        grid-row-start: 1;
        grid-row-end: 3;
    } */
     .bc{
       justify-self: start;  
     }
    </style>
  </head>
  <body>
    <h1>Grid Layout</h1>
    <div class="container">
      <div class="c1 vb">1</div>
      <div class="c1 bc">2</div>
      <div class="c1">3</div>
      <div class="c1">4</div>
      <div class="c1">5</div>
    </div>
    <h4>This is a Heading</h4>
  </body>
</html>
