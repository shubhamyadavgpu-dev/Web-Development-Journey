<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inline vs Block</title>
  </head>
  <body>
    <!--Block tags-->
    <p>Hello</p>
    <h3>How are you</h3>

    <!--Inline Tags-->
    <a href="www.youtube.com">Youtube</a>
    <a href="www.facebook.com">Facebook</a>
    <div>
      <img
        src="cybercriminal.jpg"
        alt="image not found"
        height="50px"
        width="120px"
      />
    </div>
    <!--SUPER SCRIPT-->
    a2- a<sup>2</sup>
    <br />
    <!--SUB SCRIPT-->
    h20-h<sub>2</sub>o

    <!--Pythagoras Theorem-->
    <h2>a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></h2>

    <h2>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></h2>

    <h1>The sky is cloudy &#9729; & it will rain today&#9730;</h1>
    <ul>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>

    <video
      src="dream lobby.mp4"
      width="500"
      height="400"
      controls
    ></video>

    <h2>Today is 9<sup>th</sup> of october and 2<sup>4</sup> = 16 always</h2>
    <h2>&copy;</h2>
    <h2>&trade;</h2>
    <h2>&reg;</h2>


</body>
</html>
