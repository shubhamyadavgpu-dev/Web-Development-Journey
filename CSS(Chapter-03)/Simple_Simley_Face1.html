<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Original properties</title>
    <style>
        #d1{
       width:250px;
       height:250px;
       background-color: rgb(255, 255, 0);
       border-radius:50%;
        }
        #d2{
            width:110px;
            height:60px;
            background-color: red;
            position:relative;
            top:140px;
            left:73px;
            border-radius:0 0 15px 15px;
        }
        .s1,.s2{
            height: 45px;
            width:45px;
            background-color: black;
            border-radius: 50%;
            position:absolute;
            top:40px;
            left:75px;
        }
        .s2{
     left:160px;
        }
        
    </style>
  </head>
  <body>
    <div id="d1">
      <div id="d2"></div>
      <div class="eye">
        <div class="s1"></div>
        <div class="s2"></div>
      </div>
    </div>
  </body>
</html>
